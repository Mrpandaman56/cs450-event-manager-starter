name: CI Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: npm --prefix backend install

      - name: Generate Prisma Client
        run: npm --prefix backend run prisma:generate --if-present

      - name: Run Backend Lint
        run: npm --prefix backend run lint --if-present

      - name: Run Backend Tests
        run: npm --prefix backend test --if-present

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm --prefix frontend install

      - name: Run Frontend Lint
        run: npm --prefix frontend run lint --if-present

      - name: Build Frontend
        run: npm --prefix frontend run build --if-present