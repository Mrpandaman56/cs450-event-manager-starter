services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${EVENT_MANAGER_DB_NAME:-event_manager_app}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-init:
    image: postgres:16
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        case "$$EVENT_MANAGER_DB_NAME" in
          ''|*[!A-Za-z0-9_]*)
            echo "EVENT_MANAGER_DB_NAME must contain only letters, numbers, and underscores" >&2
            exit 1
            ;;
        esac
        db_exists=$$(psql --dbname=postgres --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = '$${EVENT_MANAGER_DB_NAME}'")
        if [ "$$db_exists" = "1" ]; then
          echo "Database $$EVENT_MANAGER_DB_NAME already exists"
        else
          createdb "$$EVENT_MANAGER_DB_NAME"
          echo "Created database $$EVENT_MANAGER_DB_NAME"
        fi
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?Copy .env.example to .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      EVENT_MANAGER_DB_NAME: ${EVENT_MANAGER_DB_NAME:-event_manager_app}
    depends_on:
      db:
        condition: service_healthy

  schema:
    build: ./backend
    command: ["npm", "run", "db:push"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${EVENT_MANAGER_DB_NAME:-event_manager_app}?schema=public
    depends_on:
      db-init:
        condition: service_completed_successfully

  event:
    build: ./backend
    command: ["npm", "run", "start:event"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${EVENT_MANAGER_DB_NAME:-event_manager_app}?schema=public
      EVENT_SERVICE_PORT: "4002"
    ports:
      - "4002:4002"
    depends_on:
      db:
        condition: service_healthy
      schema:
        condition: service_completed_successfully

  user:
    build: ./backend
    command: ["npm", "run", "start:user"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${EVENT_MANAGER_DB_NAME:-event_manager_app}?schema=public
      USER_SERVICE_PORT: "4003"
    ports:
      - "4003:4003"
    depends_on:
      db:
        condition: service_healthy
      schema:
        condition: service_completed_successfully

  gateway:
    build: ./backend
    command: ["npm", "run", "start"]
    environment:
      PORT: "4001"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${EVENT_MANAGER_DB_NAME:-event_manager_app}?schema=public
      EVENT_SERVICE_URL: http://event:4002
      USER_SERVICE_URL: http://user:4003
      FRONTEND_ORIGIN: http://localhost:5174
    ports:
      - "4001:4001"
    depends_on:
      db:
        condition: service_healthy
      schema:
        condition: service_completed_successfully
      event:
        condition: service_started
      user:
        condition: service_started

  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://gateway:4001
    ports:
      - "5174:5174"
    depends_on:
      gateway:
        condition: service_started

volumes:
  postgres_data:
